<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="240" height="240">
  <!-- 背景圆角矩形 -->
  <rect x="10" y="10" width="100" height="100" rx="26" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="2" />

  <!-- 喇叭后座与握柄（深蓝） -->
  <rect x="26" y="54" width="14" height="18" rx="4" fill="#0369A1" />
  <path d="M 33 72 L 38 88" stroke="#0369A1" stroke-width="6" stroke-linecap="round" />

  <!-- 喇叭扩音筒（主天蓝） -->
  <path d="M 38 54 L 74 36 C 78 34 82 37 82 42 L 82 84 C 82 89 78 92 74 90 L 38 72 Z" fill="#38BDF8" />
  
  <!-- 喇叭口边缘（中蓝） -->
  <rect x="78" y="34" width="6" height="58" rx="3" fill="#0284C7" />

  <!-- 迷你学士帽（戴在喇叭上方，体现校园属性） -->
  <polygon points="56,22 36,30 56,38 76,30" fill="#0284C7" />
  <path d="M 44 33 L 44 41 C 44 41 56 46 68 41 L 68 33" fill="#0369A1" />
  <path d="M 72 31 L 75 42" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" />

  <!-- 声波线条 -->
  <path d="M 92 52 A 16 16 0 0 1 92 74" fill="none" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" />
  <path d="M 100 44 A 26 26 0 0 1 100 82" fill="none" stroke="#7DD3FC" stroke-width="4" stroke-linecap="round" />
</svg>