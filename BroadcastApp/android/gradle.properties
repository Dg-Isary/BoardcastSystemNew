# ---- 沙箱 / 中文路径适配（与旁边那套跑通的工程保持一致）----
org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=false
# 关掉 build-cache：沙箱里它要求缓存目录必须可写，而该目录不存在（我们只拷了依赖缓存 modules-2）
# 沙箱里文件监视不可用，关掉避免 "Couldn't open current thread, error = 5"
org.gradle.vfs.watch=false
# 工程路径含中文时 AGP 默认拒绝，这里显式放开（实测可正常构建）
android.overridePathCheck=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official