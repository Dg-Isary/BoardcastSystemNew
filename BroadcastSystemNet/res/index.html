    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <script>if (typeof Chart === 'undefined') { document.write('<scr' + 'ipt src="/res/lib/chart.umd.min.js?v=4.4.1"><\/scr' + 'ipt>'); }</script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/flatpickr.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/l10n/zh.min.js"></script>
    <script>
        if (typeof flatpickr === 'undefined') {
            document.write('<scr' + 'ipt src="/res/lib/flatpickr.min.js?v=4.6.13"><\/scr' + 'ipt>');
            document.write('<scr' + 'ipt src="/res/lib/flatpickr-zh.js?v=4.6.13"><\/scr' + 'ipt>');
        }

        // 图标字体自检：CDN 的 CSS 拿到了但字体文件取不到（被拦截/超时）时，自动切回本地 res/lib，
        // 保证图标任何时候都不会空白。背景：只判断 <link> 是否 404 不够——CSS 加载成功但字体缺失时图标会空白。
        (function () {
            function fontOk() {
                try {
                    if (!document.fonts || !document.fonts.check) return true;   // 老浏览器不阻塞
                    return document.fonts.check('900 16px "Font Awesome 6 Free"');
                } catch (e) { return true; }
            }
            function useLocal() {
                if (window.__faLocalTried) return;
                window.__faLocalTried = true;
                var cdn = document.querySelector('link[data-fa-cdn]');
                if (cdn) cdn.disabled = true;
                if (!document.querySelector('link[data-fa-local]')) {
                    var l = document.createElement('link');
                    l.rel = 'stylesheet';
                    l.href = '/res/lib/fontawesome-all.min.css?v=6.4.0';
                    l.setAttribute('data-fa-local', '1');
                    document.head.appendChild(l);
                }
                console.warn('[图标] CDN 的 Font Awesome 不可用，已自动切回本地 res/lib');
            }
            function check() {
                if (!document.fonts || !document.fonts.check) return;
                // 只对"界面真的用到"的那个字形做判定；先显式请求加载，避免 lazy 加载造成误判
                var glyph = '\uf0ac'; // fa-globe，看板标题旁一定用到
                var probe = document.fonts.load('900 16px "Font Awesome 6 Free"', glyph);
                var done = function () { if (!fontOk()) useLocal(); };
                if (probe && probe.then) probe.then(done, done);
                else done();
            }
            if (document.fonts && document.fonts.ready && document.fonts.ready.then) {
                document.fonts.ready.then(function () { setTimeout(check, 400); });
            } else {
                setTimeout(check, 1500);
            }
        })();
    </script>

<body>

    <script>
        const originalFetch = window.fetch;
        let isAuthenticating = false;
        let authPromise = null;

        function showBeautifulPasswordPrompt() {
            return new Promise((resolve) => {
                const overlay = document.createElement('div');
                overlay.style.cssText = 'position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.4);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:99999;display:flex;justify-content:center;align-items:center;opacity:0;transition:opacity 0.3s ease;';

                const modal = document.createElement('div');
                modal.style.cssText = 'background:#ffffff;padding:35px 30px;border-radius:16px;box-shadow:0 20px 40px rgba(0,0,0,0.2);width:320px;text-align:center;font-family:"Microsoft YaHei",sans-serif;transform:translateY(30px);transition:all 0.3s cubic-bezier(0.175,0.885,0.32,1.275);';

                const icon = document.createElement('div');
                icon.innerHTML = '<i class="fa-solid fa-shield-halved"></i>';
                icon.style.cssText = 'font-size:45px;color:#3498db;margin-bottom:15px;';

                const title = document.createElement('h3');
                title.innerText = '访问受限';
                title.style.cssText = 'margin:0 0 8px 0;color:#2c3e50;font-size:22px;letter-spacing:1px;';

                const desc = document.createElement('p');
                desc.innerText = '该操作受保护，请输入管理员密码';
                desc.style.cssText = 'font-size:14px;color:#7f8c8d;margin-bottom:25px;';

                const input = document.createElement('input');
                input.type = 'password';
                input.placeholder = '输入密码以继续...';
                input.style.cssText = 'width:100%;padding:12px 15px;margin-bottom:20px;border:2px solid #ecf0f1;border-radius:8px;box-sizing:border-box;font-size:16px;outline:none;transition:border 0.3s ease,box-shadow 0.3s ease;';
                input.onfocus = () => { input.style.border = '2px solid #3498db'; input.style.boxShadow = '0 0 8px rgba(52,152,219,0.3)'; };
                input.onblur = () => { input.style.border = '2px solid #ecf0f1'; input.style.boxShadow = 'none'; };

                const btn = document.createElement('button');
                btn.innerText = '认 证 授 权';
                btn.style.cssText = 'width:100%;padding:14px;background:linear-gradient(135deg, #3498db, #2980b9);color:#fff;border:none;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer;transition:transform 0.1s,box-shadow 0.3s;box-shadow:0 4px 15px rgba(52,152,219,0.4);';
                btn.onmousedown = () => btn.style.transform = 'scale(0.98)';
                btn.onmouseup = () => btn.style.transform = 'scale(1)';

                const closeBtn = document.createElement('div');
                closeBtn.innerText = '取消操作';
                closeBtn.style.cssText = 'margin-top:15px;font-size:14px;color:#bdc3c7;cursor:pointer;transition:color 0.3s;';
                closeBtn.onmouseover = () => closeBtn.style.color = '#7f8c8d';
                closeBtn.onmouseout = () => closeBtn.style.color = '#bdc3c7';

                modal.appendChild(icon); modal.appendChild(title); modal.appendChild(desc);
                modal.appendChild(input); modal.appendChild(btn); modal.appendChild(closeBtn);
                overlay.appendChild(modal); document.body.appendChild(overlay);

                requestAnimationFrame(() => { overlay.style.opacity = '1'; modal.style.transform = 'translateY(0)'; input.focus(); });

                const closeAuth = (val) => {
                    overlay.style.opacity = '0'; modal.style.transform = 'translateY(20px)';
                    setTimeout(() => { if (document.body.contains(overlay)) document.body.removeChild(overlay); resolve(val); }, 300);
                };

                closeBtn.onclick = () => closeAuth(null);
                const submitAction = () => { if (input.value) { btn.innerText = '验证中...'; closeAuth(input.value); } };
                btn.onclick = submitAction;
                input.onkeydown = (e) => { if (e.key === 'Enter') submitAction(); };
            });
        }

        window.fetch = async function (...args) {
            let [resource, config] = args; config = config || {};
            if (typeof resource === 'string' && resource.startsWith('/api/')) {
                if (!config.headers) config.headers = {};
                let token = localStorage.getItem('sys_token');
                if (token) config.headers['Authorization'] = 'Bearer ' + token;
            }
            let response = await originalFetch(resource, config);
            if (response.status === 401 && resource !== '/api/login') {
                if (!isAuthenticating) {
                    isAuthenticating = true;
                    authPromise = new Promise(async (resolve) => {
                        let pwd = await showBeautifulPasswordPrompt();
                        if (pwd !== null) {
                            let loginRes = await originalFetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pwd }) });
                            if (loginRes.ok) { let data = await loginRes.json(); localStorage.setItem('sys_token', data.token); resolve(true); }
                            else { alert("密码错误，访问被拒绝"); resolve(false); }
                        } else { resolve(false); }
                        isAuthenticating = false;
                    });
                }
                let success = await authPromise;
                if (success) {
                    if (!config.headers) config.headers = {};
                    config.headers['Authorization'] = 'Bearer ' + localStorage.getItem('sys_token');
                    return await originalFetch(resource, config);
                }
            }
            return response;
        };
    </script>

        // 与后端 ShouldPlayToday 完全一致的语义：分标记(1-10)优先于全局(0)；同优先级内后写入覆盖先写入
        function shouldPlayToday(task) {
            if (!globalSwitchState) return false;
            let now = new Date(); let todayDate = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0'); let todayWeekday = now.getDay() || 7;
            let taskMarker = parseInt(task.tiaoxiu_marker || 1);
            let matches = [];
            let order = 0;
            for (let tx of currentTiaoxiuRecords) {
                if (!tx) continue;
                let txMarker = parseInt(tx.marker);
                if (isNaN(txMarker)) txMarker = 0;
                let sDate = tx.start_date || tx.date; let eDate = tx.end_date || sDate;
                if (!sDate) continue;
                if (!(todayDate >= sDate && todayDate <= eDate)) continue;
                if (txMarker === 0) matches.push({ priority: 1, order: order++, action: tx.action });
                else if (txMarker === taskMarker) matches.push({ priority: 0, order: order++, action: tx.action });
            }
            if (matches.length > 0) {
                matches.sort((a, b) => a.priority !== b.priority ? a.priority - b.priority : b.order - a.order);
                return matches[0].action === "enable";
            }
            if ((task.specific_dates || []).includes(todayDate)) return true;
            if ((task.days || []).includes(todayWeekday)) return true;
            return false;
        }

        function renderDailyTimeline() {
            let now = new Date(); let nowSec = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
            if (nowSec === lastRenderSec) return; lastRenderSec = nowSec;
            let rawEvents = [];
            currentTasks.forEach(task => {
                if (shouldPlayToday(task)) {
                    let parts = (task.start_time || "00:00:00").split(':'); let startSec = parseInt(parts[0]) * 3600 + parseInt(parts[1]) * 60 + parseInt(parts[2]);
                    let durSec = (task.duration_m || 0) * 60 + (task.duration_s || 0); let visDur = durSec > 0 ? durSec : 1800;
                    rawEvents.push({ start: startSec, end: startSec + visDur, origDur: durSec, id: task.id });
                }
            });
            rawEvents.sort((a, b) => a.start - b.start);
            let blocks = []; let current_t = nowSec;
            rawEvents.forEach(ev => {
                if (ev.end <= current_t) return;
                if (ev.start > current_t) {
                    let gap = ev.start - current_t;
                    if (gap <= 80 * 60) blocks.push({ type: 'gap', actual_dur: gap, visual_dur: gap, is_short: true });
                    else blocks.push({ type: 'gap', actual_dur: gap, visual_dur: 80 * 60, is_short: false });
                    current_t = ev.start;
                }
                if (current_t >= ev.start && current_t < ev.end) {
                    let play_dur = ev.end - current_t;
                    blocks.push({ type: 'event', actual_dur: play_dur, visual_dur: play_dur, id: ev.id, origDur: ev.origDur });
                    current_t = ev.end;
                }
            });
            let total_visual_dur = blocks.reduce((sum, b) => sum + b.visual_dur, 0); let windowSpan = Math.max(total_visual_dur, 4800);
            let html = ''; let left_visual = 0;
            blocks.forEach(block => {
                let widthPct = (block.visual_dur / windowSpan) * 100;
                if (block.type === 'event') { let hue = (block.origDur * 137) % 360; let color = `hsl(${hue}, 90%, 65%)`; html += `<div class="timeline-event" style="left: ${left_visual}%; width: ${widthPct}%; background: ${color};" title="排程任务 | 时长: ${block.origDur === 0 ? '无限' : block.origDur + '秒'}"></div>`; }
                else if (block.type === 'gap' && block.is_short) { let color = `#ffeaa7`; html += `<div class="timeline-event" style="left: ${left_visual}%; width: ${widthPct}%; background: ${color};" title="待机间隔 (<=80分) | 实际: ${Math.round(block.actual_dur / 60)}分钟"></div>`; }
                else if (block.type === 'gap' && !block.is_short) { html += `<div class="timeline-event" style="left: ${left_visual}%; width: ${widthPct}%; background: transparent; border-bottom: 2px dashed rgba(0,0,0,0.15);" title="长间隔缩放 (>80分) | 实际: ${Math.round(block.actual_dur / 60)}分钟"></div>`; }
                left_visual += widthPct;
            });
            let nowStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
            html += `<div style="position:absolute; left:0; top:0; bottom:0; width:3px; background:#e74c3c; z-index:5; box-shadow: 1px 0 3px rgba(231,76,60,0.5);"></div><div style="position:absolute; left:5px; top:6px; font-size:0.75em; color:#2c3e50; font-family:'Consolas', 'Courier New', monospace; font-weight:bold; background:rgba(255,255,255,0.85); padding:2px 5px; border-radius:4px; line-height: 1; z-index:6;"><i class="fa-regular fa-clock" style="color:#e74c3c; margin-right:3px;"></i>${nowStr}</div>`;
            if (blocks.length > 0) {
                let endSec = current_t; let endH = Math.floor(endSec / 3600) % 24; let endM = Math.floor((endSec % 3600) / 60); let endStr = `${String(endH).padStart(2, '0')}:${String(endM).padStart(2, '0')}`;
                html += `<div style="position:absolute; right:5px; top:6px; font-size:0.75em; color:#2c3e50; font-family:'Consolas', 'Courier New', monospace; font-weight:bold; background:rgba(255,255,255,0.85); padding:2px 5px; border-radius:4px; line-height: 1; z-index:6;">${endStr}</div>`;
            }
            if (lastTimelineHtml !== html) { document.getElementById('dailyTimeline').innerHTML = html; lastTimelineHtml = html; }
        }

        // 1. 极速动画引擎：每秒刷新 16 次 (60ms)，仅请求超微型波形数据
        async function fetchWaveLoop() {
            try {
                const res = await fetch('/api/wave');
                const status = await res.json();
                if (!waveformChart) return;
                if (status.is_playing) {
                    if (status.frame_data && status.frame_data.length === 200) {
                        waveformChart.data.datasets[0].data = status.frame_data;
                        waveformChart.update();
                    }
                } else {
                    waveformChart.data.datasets[0].data = Array(200).fill(0);
                    waveformChart.update();
                }
            } catch (error) { }
            setTimeout(fetchWaveLoop, 60);
        }

        // 2. 状态监控引擎：降频为 600ms (1秒不到2次)，负责拉取沉重的 CPU/列队 等数据
        async function fetchSysLoop() {
            try {
                const res = await fetch('/api/sys');
                const status = await res.json();
                const footerLeft = document.getElementById('footer-left');

                if (status.is_playing) {
                    const songName = status.current_playing_name || '未知音频';
                    let footerIcon = '<i class="fa-solid fa-music fa-fade" style="color:#ffffff;"></i>'; let playStateText = '正在播放';
                    if (songName.includes('[定时]')) { footerIcon = '<i class="fa-solid fa-clock fa-fade" style="color:#ffffff;"></i>'; playStateText = '定时播放'; }
                    else if (songName.includes('[手动]')) { footerIcon = '<i class="fa-solid fa-gamepad fa-fade" style="color:#ffffff;"></i>'; playStateText = '手动播放'; }
                    let cleanSongName = songName.replace(/\[定时\] |\[手动\] /g, ''); let newFooterLeftHtml = `${footerIcon} <span style="margin-left:4px; font-weight:normal; opacity:0.9;">${playStateText}:</span> ${cleanSongName}`;
                    if (lastFooterLeftHtml !== newFooterLeftHtml) { footerLeft.innerHTML = newFooterLeftHtml; lastFooterLeftHtml = newFooterLeftHtml; }
                } else {
                    let newFooterLeftHtml = `<i class="fa-solid fa-stop" style="color:#ecf0f1;"></i> 待机中...`;
                    if (lastFooterLeftHtml !== newFooterLeftHtml) { footerLeft.innerHTML = newFooterLeftHtml; lastFooterLeftHtml = newFooterLeftHtml; }
                }

                if (status.sys_stats) {
                    let newFooterRightHtml = `<span><i class="fa-solid fa-microchip" style="color:#f1c40f;"></i> CPU: ${status.sys_stats.cpu.toFixed(1)}%</span><span><i class="fa-solid fa-memory" style="color:#2ecc71;"></i> RAM: ${status.sys_stats.ram.toFixed(1)}%</span>`;
                    if (lastFooterRightHtml !== newFooterRightHtml) { document.getElementById('footer-right').innerHTML = newFooterRightHtml; lastFooterRightHtml = newFooterRightHtml; }
                }

                if (status.manual_player) {
                    let mp = status.manual_player; let playBtn = document.getElementById('mpPlayBtn');
                    let newPlayBtnHtml = mp.status === 'playing' ? '<i class="fa-solid fa-pause"></i>' : '<i class="fa-solid fa-play"></i>';
                    let newPlayBtnClass = mp.status === 'playing' ? 'btn btn-primary' : 'btn btn-success';
                    if (lastPlayBtnHtml !== newPlayBtnHtml) { playBtn.innerHTML = newPlayBtnHtml; playBtn.className = newPlayBtnClass; playBtn.onclick = () => manualCmd(mp.status === 'playing' ? 'pause' : 'play'); lastPlayBtnHtml = newPlayBtnHtml; }

                    let modeBtn = document.getElementById('mpModeBtn'); let newModeBtnHtml = '';
                    if (mp.mode === 'sequential') newModeBtnHtml = '<i class="fa-solid fa-arrow-down-short-wide" title="顺序播放"></i>';
                    else if (mp.mode === 'loop') newModeBtnHtml = '<i class="fa-solid fa-repeat" title="列表循环"></i>';
                    else if (mp.mode === 'single') newModeBtnHtml = '<div style="position:relative;"><i class="fa-solid fa-repeat"></i><span style="position:absolute; font-size:0.5em; top:-5px; right:-5px;">1</span></div>';
                    if (lastModeBtnHtml !== newModeBtnHtml) { modeBtn.innerHTML = newModeBtnHtml; lastModeBtnHtml = newModeBtnHtml; }

                    if (mp.volume !== undefined && document.activeElement !== mpVolBar) { mpVolBar.value = mp.volume; document.getElementById('mpVolumeLabel').innerText = mp.volume + '%'; }

                    let progContainer = document.getElementById('mpProgressContainer');
                    if (mp.status !== 'stopped' && mp.current_duration > 0) {
                        progContainer.style.display = 'flex';
                        if (!isDraggingProgress) {
                            let pBar = document.getElementById('mpProgressBar'); pBar.max = mp.current_duration; pBar.value = mp.elapsed;
                            document.getElementById('mpElapsed').innerText = formatTime(mp.elapsed); document.getElementById('mpDuration').innerText = formatTime(mp.current_duration);
                        }
                    } else { progContainer.style.display = 'none'; }

                    let plHtml = '';
                    if (mp.queue.length === 0) { plHtml = '<div style="color:#bdc3c7; text-align:center; margin-top:20px;">队列为空，请点击加号添加音乐</div>'; }
                    else {
                        mp.queue.forEach((item, i) => {
                            let actClass = (i === mp.current_index && mp.status !== 'stopped') ? 'active' : '';
                            plHtml += `<div class="play-item ${actClass}"><div class="play-item-title" onclick="manualCmd('play_idx', ${i})" title="点击播放: ${item.name}"><i class="fa-solid fa-file-audio" style="margin-right:5px; opacity:0.7;"></i> ${item.name}</div><button class="rm-btn" onclick="manualCmd('remove', ${i})" title="移除该项"><i class="fa-solid fa-xmark"></i></button></div>`;
                        });
                    }
                    if (lastPlaylistHtml !== plHtml) { document.getElementById('manualPlaylist').innerHTML = plHtml; lastPlaylistHtml = plHtml; }
                }
            } catch (error) { }

            renderDailyTimeline();
            setTimeout(fetchSysLoop, 600); // 降频到 600ms
        }

        function handleWheel(e, el, maxVal, minVal = 0) {

            e.preventDefault();
            let val = parseInt(el.value); if (isNaN(val)) val = minVal;
            if (e.deltaY < 0) val++; else val--;

        function adjustDuration(secondsToAdd) { let t = getDurObj(); let total = (parseInt(t.m.value) || 0) * 60 + (parseInt(t.s.value) || 0) + secondsToAdd; if (total < 0) total = 0; t.m.value = String(Math.floor(total / 60)).padStart(2, '0'); t.s.value = String(total % 60).padStart(2, '0'); }

            } catch (e) { txPicker = null; }
        }
        async function openTiaoxiuModal() {
            const res = await fetch('/api/tiaoxiu'); currentTiaoxiuRecords = await res.json(); renderTiaoxiuTable();
            initTiaoxiuPicker();
            if (txPicker) txPicker.clear();
            document.getElementById('txStartDate').value = '';
            resetTiaoxiuMarker();
            resetTxAction(); document.getElementById('txNote').value = '';
            await loadInvalidTiaoxiu();
            document.getElementById('tiaoxiuModal').style.display = 'flex';
        }
        function renderTiaoxiuTable() {
            const tbody = document.getElementById('tiaoxiuTableBody'); tbody.innerHTML = '';
            if (currentTiaoxiuRecords.length === 0) return;
            currentTiaoxiuRecords.sort((a, b) => new Date(a.start_date || a.date) - new Date(b.start_date || b.date)).forEach((record, index) => {
                const tr = document.createElement('tr');
                let actionText = (record.action === 'enable') ? '<span style="color:#2ecc71; font-weight:bold;">启用</span>' : '<span style="color:#e74c3c; font-weight:bold;">禁用</span>';
                let sourceIcon = (record.source === 'sub') ? '<i class="fa-solid fa-cloud-arrow-down" style="color:#3498db;" title="云端订阅"></i> 云端' : '手动';
                let dateDisp = record.start_date || record.date;
                if (record.end_date && record.end_date !== dateDisp) dateDisp += ` <span style="color:#bdc3c7;">至</span> <br/>${record.end_date}`;

                tr.innerHTML = `<td><strong>${dateDisp}</strong></td><td><span style="background:#3498db; color:white; padding:3px 10px; border-radius:12px; font-size:0.8em;">${record.marker === 0 ? '全局' : record.marker}</span></td><td>${actionText}</td><td>${record.note || '-'}</td><td><span style="font-size:0.85em; color:#7f8c8d;">${sourceIcon}</span></td><td><button class="btn btn-danger" style="padding:4px 10px;" onclick="deleteTiaoxiuRecord(${index})"><i class="fa-solid fa-trash"></i></button></td>`;
                tbody.appendChild(tr);
            });
        }

        function addTiaoxiuRecord() {
            let startVal = '', endVal = '';
            if (txPicker && txPicker.selectedDates && txPicker.selectedDates.length > 0) {
                const fmt = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
                startVal = fmt(txPicker.selectedDates[0]);
                endVal = txPicker.selectedDates.length > 1 ? fmt(txPicker.selectedDates[1]) : startVal;
            } else {
                startVal = document.getElementById('txStartDate').value.trim();
            }
            const markerVal = getTiaoxiuMarker(); const actionVal = document.getElementById('txAction').value; const noteVal = document.getElementById('txNote').value.trim();
            if (!startVal) { uiAlert("Error", "请先选择开始日期或日期区间！"); return; }
            if (!endVal) { endVal = startVal; }
            if (new Date(endVal) < new Date(startVal)) { uiAlert("Error", "结束日期不能早于开始日期！"); return; }

            const existingIndex = currentTiaoxiuRecords.findIndex(r => r.start_date === startVal && r.end_date === endVal && r.marker === markerVal);
            if (existingIndex > -1) { currentTiaoxiuRecords[existingIndex].note = noteVal; currentTiaoxiuRecords[existingIndex].action = actionVal; currentTiaoxiuRecords[existingIndex].source = 'manual'; }
            else { currentTiaoxiuRecords.push({ start_date: startVal, end_date: endVal, marker: markerVal, action: actionVal, note: noteVal, source: 'manual' }); }
            renderTiaoxiuTable(); document.getElementById('txNote').value = '';
        }
        function deleteTiaoxiuRecord(index) { currentTiaoxiuRecords.splice(index, 1); renderTiaoxiuTable(); }
        async function saveTiaoxiu() {
            await fetch('/api/tiaoxiu', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(currentTiaoxiuRecords) });
            closeModals(); const txRes = await fetch('/api/tiaoxiu'); currentTiaoxiuRecords = await txRes.json(); lastRenderSec = -1;
        }

        // 手动触发一次云端同步：把"生效/覆盖/非法"条数如实反馈给用户
        async function syncTiaoxiuNow() {
            try {
                const res = await fetch('/api/tiaoxiu/sync', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
                const data = await res.json().catch(() => null);
                const msg = (data && data.message) ? data.message : (res.ok ? '同步完成' : '同步失败，请检查订阅地址：系统设置 → 云端订阅');
                uiAlert(res.ok ? '云端同步' : '同步失败', msg);
                if (res.ok) {
                    const txRes = await fetch('/api/tiaoxiu'); currentTiaoxiuRecords = await txRes.json();
                    renderTiaoxiuTable(); lastRenderSec = -1; await loadInvalidTiaoxiu();
                }
            } catch (e) { uiAlert('同步失败', '请求异常：' + e.message); }
        }

        async function loadMusicDict() { const res = await fetch('/api/music'); rawMusicData = await res.json(); musicMap = {}; rawMusicData.forEach(m => { if (m.id != null && m.name) musicMap[String(m.id)] = m.name; }); }
        function renderMusicSelection() {
            const availContainer = document.getElementById('available_music_container'); const selContainer = document.getElementById('selected_music_container'); availContainer.innerHTML = ''; selContainer.innerHTML = '';
            Object.keys(musicMap).forEach(id => { const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'btn-music-avail'; btn.innerHTML = `<i class="fa-solid fa-plus"></i> ${musicMap[id]}`; btn.onclick = () => { tempSelectedMusicIds.push(id); renderMusicSelection(); }; availContainer.appendChild(btn); });
            if (tempSelectedMusicIds.length === 0) selContainer.innerHTML = '<span style="color:#7f8c8d; font-size:0.9em;">暂未选择音乐...</span>';
            else { tempSelectedMusicIds.forEach((id, index) => { const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'btn-music-sel'; btn.innerHTML = `${index + 1}. ${musicMap[id] || id} <i class="fa-solid fa-xmark"></i>`; btn.onclick = () => { tempSelectedMusicIds.splice(index, 1); renderMusicSelection(); }; selContainer.appendChild(btn); }); }
        }

        async function loadTasks() {
            const res = await fetch('/api/tasks'); currentTasks = await res.json(); const tbody = document.getElementById('taskTableBody'); tbody.innerHTML = '';
            currentTasks.sort((a, b) => (a.start_time || "00").localeCompare(b.start_time || "00"));
            currentTasks.forEach((task, index) => {
                const displayNames = (task.music_ids || []).map(id => musicMap[String(id)] || id).join(' <i class="fa-solid fa-arrow-right" style="color:#bdc3c7; font-size:0.8em;"></i> ');
                let durationText = "<span style='color:#2ecc71;'><i class='fa-solid fa-infinity'></i> ∞</span>";
                if (task.duration_m > 0 || task.duration_s > 0) durationText = `<strong>${task.duration_m || 0}</strong>m <strong>${task.duration_s || 0}</strong>s`;
                let sTimeStr = task.start_time || '00:00:00'; let sParts = sTimeStr.split(':'); let sH = parseInt(sParts[0]) || 0; let sM = parseInt(sParts[1]) || 0; let sS = parseInt(sParts[2]) || 0; let dM = task.duration_m || 0; let dS = task.duration_s || 0; let endTimeHtml = "";
                if (dM === 0 && dS === 0) { endTimeHtml = `<div style="font-size:0.85em; color:#7f8c8d; margin-top:4px;"><i class="fa-solid fa-arrow-right"></i> 不限时</div>`; }
                else { let totalSec = sH * 3600 + sM * 60 + sS + dM * 60 + dS; let eH = Math.floor(totalSec / 3600) % 24; let eM = Math.floor((totalSec % 3600) / 60); let eS = totalSec % 60; let eTimeStr = `${String(eH).padStart(2, '0')}:${String(eM).padStart(2, '0')}:${String(eS).padStart(2, '0')}`; endTimeHtml = `<div style="font-size:0.85em; color:#7f8c8d; margin-top:4px;"><i class="fa-solid fa-arrow-right"></i> ${eTimeStr}</div>`; }
                let cycleHtml = (task.days || []).join(', ');
                if (task.specific_dates && task.specific_dates.length > 0) { let datesText = task.specific_dates.join('<br>'); cycleHtml += (cycleHtml ? '<br>' : '') + `<span style="color:#e74c3c; font-size:0.85em;"><i class="fa-solid fa-calendar-star"></i> ${datesText}</span>`; }
                if (!cycleHtml) cycleHtml = '-';
                let seqText = task.sequence_mode === 'random' ? (currentLang === 'zh' ? '随机' : 'Rand') : (currentLang === 'zh' ? '顺序' : 'Seq'); let volText = task.volume !== undefined ? task.volume : 100;
                let detailsHtml = `<div style="font-size:0.85em; color:#7f8c8d; display: flex; gap: 12px; align-items: center; flex-wrap: nowrap; white-space: nowrap;"><span><i class="fa-solid fa-layer-group" style="margin-right:4px;"></i>${seqText}</span><span><i class="fa-solid fa-tag" style="margin-right:4px;"></i>${currentLang === 'zh' ? '标记' : 'Mk'}: ${task.tiaoxiu_marker || 1}</span><span style="color: #3498db;"><i class="fa-solid fa-volume-low" style="margin-right:4px;"></i>${volText}%</span></div>`;
                const tr = document.createElement('tr'); tr.innerHTML = `<td style="text-align: center; color: #7f8c8d; font-weight: bold;">${index + 1}</td><td><strong style="font-size:1.1em; color:#2c3e50;">${sTimeStr}</strong>${endTimeHtml}</td><td>${durationText}</td><td>${cycleHtml}</td><td style="font-size:0.9em;">${displayNames}</td><td>${detailsHtml}</td><td><button class="btn btn-primary" style="padding: 6px 12px;" onclick="openModal(${task.id})"><i class="fa-solid fa-pen"></i></button> <button class="btn btn-danger" style="padding: 6px 12px;" onclick="deleteTask(${task.id})"><i class="fa-solid fa-trash"></i></button></td>`;
                tbody.appendChild(tr);
            });
            lastRenderSec = -1;
        }

        function deleteTask(id) { uiConfirm("Delete", translations[currentLang].delete_confirm, async () => { await fetch(`/api/tasks/${id}`, { method: 'DELETE' }); loadTasks(); }); }

        function openModal(taskId = null) {
            document.getElementById('taskModal').style.display = 'flex'; const titleEl = document.getElementById('modalTitle');
            if (taskId) titleEl.innerHTML = `<i class="fa-solid fa-pen-to-square"></i> <span data-i18n="edit_task">${translations[currentLang].edit_task}</span>`; else titleEl.innerHTML = `<i class="fa-solid fa-plus"></i> <span data-i18n="add_task">${translations[currentLang].add_task}</span>`;
            let t_st = getStObj(), t_dur = getDurObj();
            if (taskId) {
                const task = currentTasks.find(t => t.id === taskId); document.getElementById('taskId').value = task.id; let parts = (task.start_time || "00:00:00").split(':');
                t_st.h.value = parts[0] || "00"; t_st.m.value = parts[1] || "00"; t_st.s.value = parts[2] || "00"; t_dur.m.value = String(task.duration_m || 0).padStart(2, '0'); t_dur.s.value = String(task.duration_s || 0).padStart(2, '0');
                document.getElementById('task_volume').value = task.volume !== undefined ? task.volume : 100; document.getElementById('specific_dates').value = (task.specific_dates || []).join('\n'); document.getElementById('sequence_mode').value = task.sequence_mode || 'sequential'; document.getElementById('folder_mode').value = task.folder_mode || 'sequential'; setMarkerValue(document.getElementById('tiaoxiu_marker'), task.tiaoxiu_marker != null ? task.tiaoxiu_marker : 1); document.getElementById('folder_play_count').value = task.folder_play_count || 1; document.getElementById('stop_mode').value = (task.stop_mode === 'finish_track') ? 'finish_track' : 'immediate';
                document.querySelectorAll('#daysGroup input').forEach(cb => cb.checked = (task.days || []).includes(parseInt(cb.value))); tempSelectedMusicIds = (task.music_ids || []).map(String);
            } else {
                document.getElementById('taskId').value = ''; t_st.h.value = lastUsedStartTime.h; t_st.m.value = lastUsedStartTime.m; t_st.s.value = lastUsedStartTime.s; t_dur.m.value = "01"; t_dur.s.value = "00";
                document.getElementById('task_volume').value = 100; document.getElementById('specific_dates').value = ''; document.getElementById('sequence_mode').value = 'sequential'; document.getElementById('folder_mode').value = 'sequential'; resetTaskMarker(); document.getElementById('folder_play_count').value = 1; document.getElementById('stop_mode').value = 'immediate';
                document.querySelectorAll('#daysGroup input').forEach(cb => { let val = parseInt(cb.value); cb.checked = (val >= 1 && val <= 5); }); tempSelectedMusicIds = [];
            }
            resetTaskMarker();
            document.getElementById('volLabel').innerText = document.getElementById('task_volume').value + '%'; renderMusicSelection(); document.getElementById('taskModal').querySelector('.modal-box').focus();
        }

        async function saveTask() {
            let t_st = getStObj(), t_dur = getDurObj(); lastUsedStartTime = { h: t_st.h.value, m: t_st.m.value, s: t_st.s.value };
            const payload = {
                start_time: `${t_st.h.value.padStart(2, '0')}:${t_st.m.value.padStart(2, '0')}:${t_st.s.value.padStart(2, '0')}`, duration_m: parseInt(t_dur.m.value) || 0, duration_s: parseInt(t_dur.s.value) || 0, volume: parseInt(document.getElementById('task_volume').value) || 100,
                days: Array.from(document.querySelectorAll('#daysGroup input:checked')).map(cb => parseInt(cb.value)), specific_dates: document.getElementById('specific_dates').value.split(/[\n,]+/).map(s => s.trim()).filter(s => s),
                sequence_mode: document.getElementById('sequence_mode').value, folder_mode: document.getElementById('folder_mode').value, music_ids: tempSelectedMusicIds, tiaoxiu_marker: getTaskMarker(), folder_play_count: parseInt(document.getElementById('folder_play_count').value) || 1, stop_mode: document.getElementById('stop_mode').value
            };
            const taskId = document.getElementById('taskId').value; await fetch(taskId ? `/api/tasks/${taskId}` : `/api/tasks`, { method: taskId ? 'PUT' : 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            closeModals(); loadTasks();
        }

        // ================= 标记输入：滚轮调值 =================
        // 两个字段都是"数字框 + 滚轮"，但语义不同：
        //   调休那处 —— 筛选：只在"已出现过的标记"之间循环（含 0=全局）
        //   任务那处 —— 自由：0-10 之间循环（0 = 跟随全局规则）
        function parseMarker(el, fallback) {
            let v = parseInt(el && el.value, 10);
            return isNaN(v) ? fallback : v;
        }
        function holidayMarkerCycle() {
            const set = new Set([0]);
            (currentTiaoxiuRecords || []).forEach(r => { const m = parseInt(r.marker); if (!isNaN(m)) set.add(m); });
            return Array.from(set).filter(m => m >= 0 && m <= 10).sort((a, b) => a - b);
        }
        function stepValue(cur, delta, list) {
            if (!list || list.length === 0) return cur;
            let i = list.indexOf(cur); if (i < 0) i = 0;
            i = (i + delta % list.length + list.length) % list.length;
            return list[i];
        }
        function setMarkerValue(el, v) { if (el) el.value = String(v); }
        function getTiaoxiuMarker() {
            const el = document.getElementById('txMarker'); if (!el) return 0;
            let v = parseMarker(el, 0);
            const list = holidayMarkerCycle();
            if (!list.includes(v)) { v = list.includes(0) ? 0 : list[0]; setMarkerValue(el, v); }
            return v;
        }
        // 启用/禁用改成点一下切换：不再用下拉框，避免误点展开还要再选一次
        function toggleTxAction() {
            const hidden = document.getElementById('txAction');
            const next = (hidden && hidden.value === 'enable') ? 'disable' : 'enable';
            applyTxActionUI(next);
        }
        function applyTxActionUI(action) {
            const hidden = document.getElementById('txAction');
            const btn = document.getElementById('txActionToggle');
            if (hidden) hidden.value = action;
            if (!btn) return;
            const dict = (translations[currentLang] || translations.zh);
            if (action === 'enable') {
                btn.style.background = '#2ecc71'; btn.style.color = '#fff';
                btn.title = dict.act_enable_tip;
                btn.innerHTML = '<i class="fa-solid fa-check"></i> <span id="txActionText" data-i18n="act_enable">' + dict.act_enable + '</span>';
            } else {
                btn.style.background = '#e74c3c'; btn.style.color = '#fff';
                btn.title = dict.act_disable_tip;
                btn.innerHTML = '<i class="fa-solid fa-ban"></i> <span id="txActionText" data-i18n="act_disable">' + dict.act_disable + '</span>';
            }
        }
        function resetTxAction() { applyTxActionUI('disable'); }
        function getTaskMarker() {
            const el = document.getElementById('tiaoxiu_marker'); if (!el) return 1;
            let v = parseMarker(el, 1);
            if (v < 0 || v > 10) { v = 1; setMarkerValue(el, v); }
            return v;
        }
        function wheelHolidayMarker(e, el) {
            e.preventDefault();
            const list = holidayMarkerCycle();
            const next = stepValue(parseMarker(el, 0), e.deltaY < 0 ? 1 : -1, list);
            setMarkerValue(el, next);
            el.title = `标记 ${next}` + (next === 0 ? '（全局：影响所有任务）' : `（只影响绑定标记 ${next} 的任务）`) + "　滚轮切换";
        }
        function wheelTaskMarker(e, el) {
            e.preventDefault();
            const list = []; for (let m = 0; m <= 10; m++) list.push(m);
            const next = stepValue(parseMarker(el, 1), e.deltaY < 0 ? 1 : -1, list);
            setMarkerValue(el, next);
            el.title = next === 0 ? "标记 0：跟随全局调休规则" : `标记 ${next}：只受标记 ${next} 的规则影响`;
        }
        function resetTiaoxiuMarker() { const el = document.getElementById('txMarker'); if (el) { setMarkerValue(el, 0); el.title = '标记 0（全局：影响所有任务）　滚轮切换'; } }
        function resetTaskMarker() { const el = document.getElementById('tiaoxiu_marker'); if (el) { setMarkerValue(el, 1); el.title = '标记 1：只受标记 1 的规则影响　滚轮在 0-10 循环'; } }

        // ================= 云端无效数据（红字 + 删除线） =================
        async function loadInvalidTiaoxiu() {
            try {
                const res = await fetch('/api/tiaoxiu/invalid'); const groups = await res.json();
                const section = document.getElementById('txInvalidSection'); const tbody = document.getElementById('txInvalidTableBody');
                tbody.innerHTML = ''; let total = 0;
                (groups || []).forEach(g => {
                    (g.items || []).forEach(it => {
                        total++;
                        const tr = document.createElement('tr');
                        tr.innerHTML = '<td style="font-size:0.85em; color:#7f8c8d;">' + (g.synced_at || '-') + '</td>' +
                            '<td style="color:#e74c3c; text-decoration:line-through;">' + (it.reason || '无法解析') + '</td>' +
                            '<td style="color:#e74c3c; text-decoration:line-through; font-size:0.85em; word-break:break-all;">' + String(it.raw || '').replace(/</g, '&lt;') + '</td>';
                        tbody.appendChild(tr);
                    });
                });
                section.style.display = total > 0 ? 'block' : 'none';
            } catch (e) { document.getElementById('txInvalidSection').style.display = 'none'; }
        }
        async function clearInvalidTiaoxiu() {
            if (!confirm('确定清除这些无效的云端数据记录吗？只删除无效项，不影响任何调休规则。')) return;
            await fetch('/api/tiaoxiu/invalid', { method: 'DELETE' });
            await loadInvalidTiaoxiu();
        }

        // ================= 执行日志 =================
        let currentLog = [];
        async function openLogModal() {
            document.getElementById('logModal').style.display = 'flex';
            await loadLog();
        }
        function closeLogModal() { document.getElementById('logModal').style.display = 'none'; }
        async function loadLog() {
            try { const res = await fetch('/api/log?limit=300'); currentLog = await res.json(); renderLogTable(); } catch (e) { }
        }
        function renderLogTable() {
            const tbody = document.getElementById('logTableBody'); if (!tbody) return;
            const onlyProblem = document.getElementById('logOnlyProblem').checked;
            const rows = (currentLog || []).filter(e => !onlyProblem || e.level === 'error' || e.level === 'warn');
            tbody.innerHTML = '';
            if (rows.length === 0) { tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:#bdc3c7;">暂无记录</td></tr>'; return; }
            rows.slice().reverse().forEach(e => {
                const color = e.level === 'error' ? '#e74c3c' : (e.level === 'warn' ? '#e67e22' : '#2c3e50');
                const tr = document.createElement('tr');
                tr.innerHTML = '<td style="font-size:0.85em; font-family:Consolas,monospace;">' + (e.time || '') + '</td>' +
                    '<td style="font-size:0.85em;">' + (e.category || '') + '</td>' +
                    '<td style="font-size:0.85em; color:' + color + '; font-weight:bold;">' + (e.action || '') + '</td>' +
                    '<td style="font-size:0.8em; color:' + color + ';">' + (e.level || '') + '</td>' +
                    '<td style="font-size:0.85em;">' + (e.task || '') + '</td>' +
                    '<td style="font-size:0.85em;">' + String(e.detail || e.name || '').replace(/</g, '&lt;') + '</td>';
                tbody.appendChild(tr);
            });
        }

        // ================= 后台提示横幅（引用失效 / 端口冲突 / 同步异常） =================
        let alertCursor = parseInt(localStorage.getItem('alert_cursor') || '0');
        async function pollAlerts() {
            try {
                const res = await fetch('/api/alerts?after=' + alertCursor); const list = await res.json();
                if (list && list.length > 0) {
                    const banner = document.getElementById('alertBanner');
                    const latest = list[list.length - 1];
                    document.getElementById('alertBody').innerHTML = list.map(a => '<div>· [' + a.time + '] ' + String(a.message || '').replace(/</g, '&lt;') + '</div>').join('');
                    banner.style.display = 'block';
                    alertCursor = latest.id;
                }
            } catch (e) { }
            setTimeout(pollAlerts, 15000);
        }
        function dismissAlerts() {
            localStorage.setItem('alert_cursor', String(alertCursor));
            document.getElementById('alertBanner').style.display = 'none';
        }

        async function initData() {
            setLanguage('zh'); await loadMusicDict(); const txRes = await fetch('/api/tiaoxiu'); currentTiaoxiuRecords = await txRes.json(); await loadTasks();

            // 数据初始化完成后，启动双轨引擎
            initWaveformChart();
            fetchSysLoop();
            fetchWaveLoop();
            pollAlerts();
        }
        checkSecurityOnLoad();
    </script>
